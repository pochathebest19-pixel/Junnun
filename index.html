<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junnun.in — Coming Soon</title>
<meta name="description" content="Junnun.in connects everyday coaches with children for affordable sports, music and arts training — quality coaching within every family's reach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#04140f; --mid:#0b3527; --sea:#125c44; --grass:#1d9166;
    --lime:#c9f24a; --sand:#f6d98a; --cream:#f3faf5;
    --fg:#f3faf5; --muted:#a7c4b6;
    --glass:rgba(255,255,255,.055); --edge:rgba(255,255,255,.13);
    --ink:rgba(255,255,255,.9);
  }
  @media (prefers-color-scheme:light){
    :root{
      --deep:#f2faf4; --mid:#dff2e5; --sea:#c2e6d0; --grass:#9ed8b4;
      --lime:#4d7c0f; --sand:#b45309; --cream:#0a2018;
      --fg:#0a2018; --muted:#4a6357;
      --glass:rgba(255,255,255,.62); --edge:rgba(10,32,24,.1);
      --ink:rgba(10,32,24,.55);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    position:relative; overflow:hidden; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
    background:linear-gradient(-45deg,var(--deep),var(--mid),var(--sea),var(--grass));
    background-size:400% 400%; animation:flow 22s ease infinite;
    color:var(--fg); font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    text-align:center;
  }
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  /* ---- drifting scene layer ---- */
  .scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .drift{
    position:absolute; left:100%; color:var(--ink); opacity:0;
    animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite;
    will-change:transform,opacity;
  }
  .drift svg{display:block;width:100%;height:100%;
    fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  @keyframes drift{
    0%  {transform:translate(0,0) rotate(0deg); opacity:0}
    8%  {opacity:.5}
    50% {transform:translate(-55vw,-22px) rotate(6deg)}
    92% {opacity:.5}
    100%{transform:translate(-118vw,0) rotate(-4deg); opacity:0}
  }
  /* larger story vignettes read as scenes, not clutter */
  .vignette{opacity:0;stroke-width:1.25}
  .vignette svg{stroke-width:1.25}

  /* ---- card ---- */
  .card{
    position:relative;z-index:2;width:100%;max-width:640px;
    padding:clamp(2.25rem,5.5vw,3.75rem) clamp(1.5rem,5vw,3.25rem);
    border-radius:32px;background:var(--glass);border:1px solid var(--edge);
    backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);
    box-shadow:0 32px 80px -24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}

  .eyebrow{
    display:inline-flex;align-items:center;gap:.6rem;
    font-size:.7rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--fg);opacity:.85;
    border:1px solid var(--edge);border-radius:999px;padding:.5rem 1.05rem;margin-bottom:1.75rem;
    background:rgba(127,127,127,.07);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 60%,transparent);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 55%,transparent)}
    70%{box-shadow:0 0 0 11px transparent}100%{box-shadow:0 0 0 0 transparent}}

  h1{
    font-family:"Fraunces",Georgia,serif;font-weight:700;
    font-size:clamp(2.6rem,8.5vw,4.75rem);line-height:.95;letter-spacing:-.035em;
    margin-bottom:1.1rem;
  }
  h1 .dotin{color:var(--lime);font-style:italic;font-weight:500}

  .rule{width:56px;height:2px;margin:0 auto 1.35rem;border-radius:2px;
    background:linear-gradient(90deg,var(--lime),transparent)}

  .tagline{
    font-size:clamp(1rem,2.2vw,1.12rem);font-weight:500;line-height:1.68;
    color:var(--muted);max-width:30rem;margin:0 auto 2rem;
  }
  .tagline b{color:var(--fg);font-weight:600}

  .tags{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2rem}
  .tag{
    display:inline-flex;align-items:center;gap:.45rem;
    font-size:.82rem;font-weight:600;letter-spacing:.01em;
    border:1px solid var(--edge);border-radius:999px;padding:.46rem 1rem;
    background:rgba(127,127,127,.07);transition:transform .25s,border-color .25s;
  }
  .tag:hover{transform:translateY(-2px);border-color:var(--lime)}
  .tag svg{width:15px;height:15px;fill:none;stroke:var(--lime);stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}

  .foot{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);opacity:.8}

  @media (prefers-reduced-motion:reduce){
    body,.drift,.dot,.card{animation:none!important}
    .drift{opacity:.35}
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <!-- ═══ SPORTS ═══ -->
  <!-- football -->
  <div class="drift" style="top:12%;width:56px;height:56px;animation-duration:34s;animation-delay:-2s">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M20 8l6 4.5-2.3 7h-7.4l-2.3-7L20 8zM6.5 15.5l7.5 2M33.5 15.5l-7.5 2M12 31l4.3-6.5M28 31l-4.3-6.5"/></svg>
  </div>
  <!-- badminton racket + shuttle -->
  <div class="drift" style="top:63%;width:62px;height:62px;animation-duration:41s;animation-delay:-9s">
    <svg viewBox="0 0 40 40"><ellipse cx="14" cy="13" rx="9" ry="11"/><path d="M8 8l12 10M20 8L8 18M14 24l6 9"/><path d="M30 26l4-4 3 5-4 3z"/><path d="M30 26l-3 3"/></svg>
  </div>
  <!-- cricket bat + ball -->
  <div class="drift" style="top:34%;width:52px;height:52px;animation-duration:47s;animation-delay:-22s">
    <svg viewBox="0 0 40 40"><path d="M24 6l6 6-13 15-6-6z"/><path d="M11 21l-5 6 4 4 6-5"/><circle cx="31" cy="30" r="5"/><path d="M28 27.5c2 1.5 3.5 3.5 4 6"/></svg>
  </div>
  <!-- trophy -->
  <div class="drift" style="top:80%;width:46px;height:46px;animation-duration:38s;animation-delay:-30s">
    <svg viewBox="0 0 40 40"><path d="M13 7h14v9a7 7 0 01-14 0z"/><path d="M13 10H8v3a5 5 0 005 5M27 10h5v3a5 5 0 01-5 5"/><path d="M20 23v6M14 33h12l-1.5-4h-9z"/></svg>
  </div>

  <!-- basketball -->
  <div class="drift" style="top:17%;width:44px;height:44px;animation-duration:37s;animation-delay:-19s">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><path d="M20 4v32M4 20h32M9 9c6 5 6 17 0 22M31 9c-6 5-6 17 0 22"/></svg>
  </div>
  <!-- medal -->
  <div class="drift" style="top:3%;width:40px;height:40px;animation-duration:45s;animation-delay:-28s">
    <svg viewBox="0 0 40 40"><path d="M14 5l6 11M26 5l-6 11"/><circle cx="20" cy="25" r="10"/><path d="M20 20l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z"/></svg>
  </div>

  <!-- ═══ MUSIC ═══ -->
  <!-- guitar -->
  <div class="drift" style="top:22%;width:50px;height:50px;animation-duration:44s;animation-delay:-14s">
    <svg viewBox="0 0 40 40"><path d="M17 20a7 7 0 108 8c1-3 4-3 5-6s-2-5-5-4-3 4-6 5a7 7 0 00-2-3z" transform="rotate(-12 20 22)"/><circle cx="17.5" cy="25.5" r="3"/><path d="M27 15l6-6M31 7l3 3"/></svg>
  </div>
  <!-- tabla / drum -->
  <div class="drift" style="top:47%;width:46px;height:46px;animation-duration:36s;animation-delay:-26s">
    <svg viewBox="0 0 40 40"><ellipse cx="20" cy="13" rx="11" ry="5"/><path d="M9 13v12c0 3 5 5 11 5s11-2 11-5V13"/><path d="M13 17.5v10M27 17.5v10M20 18.5v11"/></svg>
  </div>
  <!-- music notes -->
  <div class="drift" style="top:72%;width:40px;height:40px;animation-duration:31s;animation-delay:-5s">
    <svg viewBox="0 0 40 40"><path d="M15 27V10l14-3v17"/><ellipse cx="11.5" cy="28" rx="4" ry="3.2"/><ellipse cx="25.5" cy="25" rx="4" ry="3.2"/><path d="M15 15l14-3"/></svg>
  </div>
  <!-- flute -->
  <div class="drift" style="top:6%;width:58px;height:58px;animation-duration:49s;animation-delay:-38s">
    <svg viewBox="0 0 40 40"><path d="M6 25L31 12a3 3 0 013 5L11 29a3 3 0 01-5-4z"/><circle cx="15" cy="23" r="1.2"/><circle cx="20" cy="20.5" r="1.2"/><circle cx="25" cy="18" r="1.2"/></svg>
  </div>

  <!-- piano keys -->
  <div class="drift" style="top:58%;width:52px;height:52px;animation-duration:50s;animation-delay:-41s">
    <svg viewBox="0 0 40 40"><rect x="5" y="13" width="30" height="15" rx="2"/><path d="M12 13v15M19 13v15M26 13v15"/><path d="M9.5 13v8h4v-8M16.5 13v8h4v-8M23.5 13v8h4v-8"/></svg>
  </div>
  <!-- violin -->
  <div class="drift" style="top:44%;width:48px;height:48px;animation-duration:40s;animation-delay:-7s">
    <svg viewBox="0 0 40 40"><path d="M16 22a6 6 0 106 6 5 5 0 014-4 5 5 0 10-6-6 5 5 0 01-4 4z" transform="rotate(-20 20 24)"/><path d="M25 16l7-7M30 7l4 4M17 25l6-6"/></svg>
  </div>

  <!-- ═══ ART ═══ -->
  <!-- palette -->
  <div class="drift" style="top:55%;width:48px;height:48px;animation-duration:42s;animation-delay:-17s">
    <svg viewBox="0 0 40 40"><path d="M20 5a15 15 0 000 30c3 0 3-3 2-5s1-4 4-4h4a5 5 0 005-5C35 12 28 5 20 5z"/><circle cx="14" cy="13" r="1.8"/><circle cx="24" cy="11" r="1.8"/><circle cx="11" cy="22" r="1.8"/><circle cx="29" cy="18" r="1.8"/></svg>
  </div>
  <!-- brush + pencil -->
  <div class="drift" style="top:88%;width:52px;height:52px;animation-duration:39s;animation-delay:-11s">
    <svg viewBox="0 0 40 40"><path d="M8 32c0-4 2-6 5-6s5 2 5 5-3 5-7 5H8z"/><path d="M13 26L29 9a3 3 0 014 4L16 30"/><path d="M26 12l4 4"/></svg>
  </div>
  <!-- easel -->
  <div class="drift" style="top:40%;width:50px;height:50px;animation-duration:53s;animation-delay:-44s">
    <svg viewBox="0 0 40 40"><rect x="11" y="7" width="18" height="14" rx="1.5"/><path d="M20 21v12M12 35l8-8 8 8M14 29h12"/></svg>
  </div>

  <!-- crayons -->
  <div class="drift" style="top:85%;width:46px;height:46px;animation-duration:35s;animation-delay:-13s">
    <svg viewBox="0 0 40 40"><path d="M11 30V16l3-5 3 5v14zM20 30V14l3-5 3 5v16zM29 30V18l3-5 3 5v12z"/><path d="M11 21h6M20 19h6M29 23h6"/></svg>
  </div>
  <!-- paint tube -->
  <div class="drift" style="top:76%;width:42px;height:42px;animation-duration:54s;animation-delay:-50s">
    <svg viewBox="0 0 40 40"><path d="M13 12h11l6 16a3 3 0 01-3 4H14a3 3 0 01-3-4z"/><path d="M15 8h7v4h-7zM17 5h3v3h-3"/><path d="M14 22h12"/></svg>
  </div>

  <!-- ═══ SCENE: COACH TEACHING A CHILD ═══ -->
  <div class="drift vignette" style="top:28%;width:120px;height:88px;animation-duration:58s;animation-delay:-6s">
    <svg viewBox="0 0 120 88">
      <!-- coach (taller, arm extended guiding) -->
      <circle cx="34" cy="20" r="7"/>
      <path d="M34 27v22M34 33l14 6M34 33l-9 8M34 49l-7 17M34 49l8 17"/>
      <!-- cap brim -->
      <path d="M27 17h14M41 17l5 1"/>
      <!-- child (smaller, mirroring the motion) -->
      <circle cx="79" cy="37" r="5.5"/>
      <path d="M79 42.5v15M79 47l-10-6M79 47l8 5M79 57.5l-6 11M79 57.5l6 11"/>
      <!-- ball between them -->
      <circle cx="60" cy="45" r="5"/>
      <!-- ground line -->
      <path d="M14 70h92" stroke-dasharray="3 7"/>
    </svg>
  </div>

  <!-- ═══ SCENE: CHILDREN COMPETING (race to the tape) ═══ -->
  <div class="drift vignette" style="top:66%;width:140px;height:82px;animation-duration:62s;animation-delay:-34s">
    <svg viewBox="0 0 140 82">
      <!-- runner 1 -->
      <circle cx="26" cy="20" r="5.5"/>
      <path d="M26 25.5v14M26 30l-9 4M26 30l10-5M26 39.5l-9 13M26 39.5l9 9"/>
      <!-- runner 2 -->
      <circle cx="62" cy="24" r="5.5"/>
      <path d="M62 29.5v13M62 33l-10 6M62 33l9-6M62 42.5l-8 12M62 42.5l10 10"/>
      <!-- runner 3 -->
      <circle cx="98" cy="19" r="5.5"/>
      <path d="M98 24.5v14M98 29l-10 3M98 29l9-5M98 38.5l-7 14M98 38.5l10 8"/>
      <!-- finish tape + flag -->
      <path d="M128 12v52M128 14h10v7h-10"/>
      <path d="M8 64h120" stroke-dasharray="3 7"/>

  </div>
</div>

<main class="card">
  <span class="eyebrow"><span class="dot"></span>Coming Soon</span>

  <h1>Junnun<span class="dotin">.in</span></h1>
  <div class="rule"></div>

  <p class="tagline">
    A place where <b>anyone with a skill can coach</b> — and <b>every child can learn</b>.
    Sports, music and arts training at a price families can actually afford.
  </p>

  <div class="tags">
    <span class="tag"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3l4 3-1.5 5h-5L8 6z"/></svg>Sports</span>
    <span class="tag"><svg viewBox="0 0 24 24"><path d="M9 17V5l11-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></svg>Music</span>
    <span class="tag"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 000 18c1.8 0 1.8-1.8 1.2-3s.6-2.4 2.4-2.4H18a3 3 0 003-3c0-5.4-4.2-9.6-9-9.6z"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="14" cy="7" r="1"/><circle cx="7" cy="13.5" r="1"/></svg>Arts</span>
  </div>

  <p class="foot">Coaches &amp; Students · Opening soon</p>
</main>

</body>
</html>
